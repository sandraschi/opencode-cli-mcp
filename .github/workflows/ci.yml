name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --group dev --extra rag
      - name: Ruff check
        run: uv run ruff check src/ api/
      - name: Ruff format check
        run: uv run ruff format src/ api/ --check
      - name: Pyright typecheck
        run: uv run pyright src/ api/
      - name: Tests
        run: uv run pytest tests/ -q

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web_sota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Biome check
        run: npm run biome:ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
