[project]
name = "opencode-cli-mcp"
version = "0.2.1"
description = "MCP server wrapping opencode CLI (opencode serve) for AI agent orchestration"
authors = [{ name = "Sandra Schipal" }]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "psutil>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov=api --cov-report=term-missing --cov-fail-under=30"

[project.scripts]
opencode-cli-mcp = "opencode_cli_mcp.server:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.0,<0.17",
    "pre-commit>=4.0.0",
    "pytest-cov>=7.1.0",
    "pyright>=1.1.411",
]
